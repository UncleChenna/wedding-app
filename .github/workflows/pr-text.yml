name: PR text
on:
  pull_request:
    types: [edited]
permissions:
  contents: read
concurrency:
  group: pr-text-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-text:
    name: no AI attribution in PR text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/harness/commit-rules.mjs pr
