name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` re-runs the PR text check when a title or body changes.
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Public local-development defaults (same as .env.example). Not secrets.
env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  LOG_LEVEL: info
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH

jobs:
  tickets:
    name: tickets valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm t:validate

  pr-text:
    name: no AI attribution in PR text
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # PR text is untrusted: pass it through env, never interpolate it into the script.
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/harness/commit-rules.mjs pr

  verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    # Full browser matrix measured 16.3m, plus setup/unit/build and scanner checks.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm agents:link && pnpm agents:check
      - name: Prepare the verification database
        run: pnpm db:migrate
      - run: pnpm verify
      - name: Verify scanner credentials in Chromium and WebKit
        run: pnpm test:gate
      - name: Preserve scanner verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verification
          path: artifacts/TICKET-057/
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    name: migrations + seed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate (twice, to prove it is idempotent)
        run: pnpm db:migrate && pnpm db:migrate
      - name: Seed (twice, to prove it is repeatable)
        run: pnpm db:seed && pnpm db:seed
      - name: Migrations match schema.ts
        run: pnpm db:generate --name ci-drift-check && git diff --exit-code drizzle/ && test -z "$(git ls-files --others --exclude-standard drizzle/)"

  guest-journey:
    name: invitation journey (mobile + desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm exec tsx scripts/test-guest-journey.ts
      - name: Verify authenticated scanner recovery and camera lifecycle
        run: pnpm exec tsx scripts/test-scanner-journey.ts
      - name: Verify atomic partial admission and concurrent retries
        run: pnpm exec vitest run scripts/__tests__/online-admission.integration.test.ts scripts/__tests__/scan-observation.integration.test.ts
        env:
          RUN_ONLINE_ADMISSION_DB_TESTS: "1"
          RUN_SCAN_OBSERVATION_DB_TESTS: "1"
      - name: Verify partial admission and lost-response recovery in browsers
        run: pnpm exec tsx scripts/test-online-admission.ts
      - name: Verify authenticated offline scanner and sign-out
        run: pnpm exec tsx scripts/test-offline-scanner.ts
      - name: Verify minimal private scanner projection
        run: pnpm exec vitest run scripts/__tests__/guest-snapshot.integration.test.ts
        env:
          RUN_GUEST_SNAPSHOT_DB_TESTS: "1"
      - name: Verify authenticated cached scanner reads and revocation refresh
        run: pnpm exec tsx scripts/test-guest-snapshot.ts
      - name: Verify atomic shared-network request budgets
        run: pnpm exec vitest run scripts/__tests__/rate-limit.integration.test.ts
        env:
          RUN_RATE_LIMIT_DB_TESTS: "1"
      - name: Verify ordering rate-limit recovery
        run: pnpm exec playwright test e2e/order-submit.spec.ts --project=mobile --project=desktop --workers=1 --grep "network limit"
        env:
          RUN_ORDER_BROWSER_TESTS: "1"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: guest-journey-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  camera-decoding:
    name: camera QR pixels (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test --config scripts/camera-verification.config.ts
      - name: Verify offline scanner storage, cold restart and camera expiry
        run: pnpm exec playwright test --config scripts/scanner-shell.config.ts
      - name: Verify private snapshot lifecycle and worker upgrades
        run: pnpm exec playwright test --config scripts/guest-snapshot.config.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: camera-decoding-evidence
          path: |
            artifacts/TICKET-059/camera/
            artifacts/TICKET-108/store/
            artifacts/TICKET-065/store/
          retention-days: 7

  admin-journey:
    name: admin journey (mobile + desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Isolated Auth, mail, database and admin journey
        run: pnpm exec tsx scripts/test-admin-journey.ts --ci
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-journey-evidence
          path: artifacts/TICKET-134/
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-dashboard-evidence
          path: artifacts/TICKET-097/
          retention-days: 7
      - name: Preserve scan log evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-scan-log-evidence
          path: artifacts/TICKET-174/
          retention-days: 7
      - name: Verify transaction-bound gate broadcasts
        run: RUN_REALTIME_DB_TESTS=1 pnpm exec vitest run scripts/__tests__/gate-broadcast.integration.test.ts --maxWorkers=1
      - name: Verify two-scanner Realtime, polling and admission retries
        run: pnpm exec tsx scripts/test-scanner-updates.ts
      - name: Preserve scanner synchronization evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scanner-synchronization-evidence
          path: docs/reviews/TICKET-068/
          retention-days: 7
      - name: Stop this job's isolated stack
        if: always()
        run: test ! -f .harness/worktree.json || pnpm db:stop
