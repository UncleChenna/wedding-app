name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` re-runs the PR text check when a title or body changes.
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Public local-development defaults (same as .env.example). Not secrets.
env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  LOG_LEVEL: info
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH

jobs:
  tickets:
    name: tickets valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm t:validate

  pr-text:
    name: no AI attribution in PR text
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # PR text is untrusted: pass it through env, never interpolate it into the script.
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/harness/commit-rules.mjs pr

  verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm agents:link && pnpm agents:check
      - name: Prepare the verification database
        run: pnpm db:migrate
      - run: pnpm verify
      - name: Verify scanner credentials in Chromium and WebKit
        run: pnpm test:gate
      - name: Preserve scanner verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verification
          path: artifacts/TICKET-057/
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    name: migrations + seed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate (twice, to prove it is idempotent)
        run: pnpm db:migrate && pnpm db:migrate
      - name: Seed (twice, to prove it is repeatable)
        run: pnpm db:seed && pnpm db:seed
      - name: Migrations match schema.ts
        run: pnpm db:generate --name ci-drift-check && git diff --exit-code drizzle/ && test -z "$(git ls-files --others --exclude-standard drizzle/)"

  guest-journey:
    name: invitation journey (mobile + desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm exec tsx scripts/test-guest-journey.ts
      - name: Verify authenticated scanner recovery and camera lifecycle
        run: pnpm exec tsx scripts/test-scanner-journey.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: guest-journey-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  camera-decoding:
    name: camera QR pixels (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test --config scripts/camera-verification.config.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: camera-decoding-evidence
          path: artifacts/TICKET-059/camera/
          retention-days: 7
